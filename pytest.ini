[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --alluredir=allure-results --reruns 1 --reruns-delay 1
    --only-rerun TargetClosedError --only-rerun "net::ERR" --only-rerun ERR_CONNECTION
    --only-rerun "Page.goto"
# --only-rerun used to include a blanket "TimeoutError", which retried EVERY
# Playwright timeout once — including a Locator.click/wait_for timeout caused
# by a locator that no longer matches anything (UI drift, a missing
# precondition). That is never transient, so the retry only doubled the cost
# of the exact failures that killed the 2026-09-09 full run (Error 124 at 90m
# — see the create-lead State-field investigation). The one genuinely
# transient TimeoutError in this suite is a cold `Page.goto(BASE_URL)` in the
# `logged_in_page` fixture timing out at NAV_TIMEOUT; that failure's message
# is prefixed "Page.goto:" (Playwright capitalizes the API name), which is
# what this pattern targets — narrower than the old blanket match, without
# losing the one retry that was actually worth having.
# If a single test's setup+call+teardown runs longer than this, faulthandler
# dumps every thread's stack to stderr (test file:line + the Playwright frame
# beneath it) and the test keeps running. 180s clears the worst legitimate
# case — a cold auth_state re-login (~125s: 60s validity check + 60s fresh
# OTP login) — without waiting too long on a real stall. Tighten it per-run
# with `-o faulthandler_timeout=N` when hunting something specific (this is
# an ini-only option — pytest has no --faulthandler-timeout CLI flag).
faulthandler_timeout = 180
# Hard ceiling above faulthandler_timeout: a stall dumps its stacks at 180s
# (above), then this actually fails the test at 300s instead of hanging
# forever, in MOST cases. `signal` (SIGALRM in the main thread), not `thread`
# — `thread` hard-kills the whole process on timeout, which on a
# multi-hundred-test run would abandon every test after the stalled one;
# `signal` raises where sync Playwright runs, so the test fails normally,
# fixtures tear down, and the session continues. A timeout failure
# ("Failed: Timeout >300.0s") matches none of the --only-rerun patterns
# above, so it is never retried.
#
# Residual gap (verified, not theoretical — see the scratchpad probes from
# the session that added this): this timer is a SINGLE, non-repeating alarm
# covering setup+call+teardown as one window. If it has to fire by force-
# interrupting an in-flight Playwright driver call (rather than a call
# raising its own timeout cleanly on its own, which is the common case and
# unaffected by any of this), the interrupted call can leave the driver's
# IPC channel broken — and the context/browser `.close()` in fixture
# teardown then blocks forever on it, with no alarm left to interrupt THAT.
# A thread-based bounded close() was tried and rejected: Playwright's sync
# API is main-thread-only and raises immediately if touched from another
# thread. The real backstop for this one case is process-level, in the
# Makefile (`SUITE_TIMEOUT`, wrapping `all`/`e2e`/`headless`) — it guarantees
# the whole run terminates even here, at the cost of that run's report.
timeout = 300
timeout_method = signal
markers =
    e2e: happy-path tests covering the full loan lifecycle
    known_bug: asserts correct behaviour for a documented app defect; xfail(strict=True) so a fix surfaces as XPASS instead of silently going green
